<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Hack The Box Achievements</title>
  <desc id="desc">Dark achievement banner with a lime green trophy emblem.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#111c28"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ff38"/>
      <stop offset="1" stop-color="#70c900"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#273542" stroke-width="1" opacity=".3"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="180" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="180" fill="url(#background)"/>
    <rect width="900" height="180" fill="url(#grid)"/>
    <path d="M 540 180 L 720 0 H 900 V 180 Z" fill="#9fef00" opacity=".035"/>
    <path d="M 720 180 L 900 0" stroke="#9fef00" stroke-width="2" opacity=".12"/>
    <rect x="0" y="0" width="8" height="180" fill="url(#accent)"/>
    <rect x="39" y="31" width="120" height="120" rx="24" fill="#9fef00" opacity=".08" stroke="#9fef00" stroke-opacity=".35"/>
    <path d="M 74 61 H 124 V 83 C 124 100 114 110 99 110 C 84 110 74 100 74 83 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 74 70 H 62 V 79 C 62 88 67 93 77 94 M 124 70 H 136 V 79 C 136 88 131 93 121 94 M 99 110 V 124 M 84 124 H 114" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="99" cy="81" r="6" fill="#9fef00"/>
    <text x="194" y="62" fill="#9fef00" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="5">HACK THE BOX</text>
    <text x="191" y="115" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing="2">ACHIEVEMENTS</text>
    <path d="M 194 136 H 526" stroke="#9fef00" stroke-width="2" opacity=".7"/>
    <path d="M 775 38 H 847 V 110 H 775 Z" fill="none" stroke="#9fef00" stroke-width="2" opacity=".35" transform="rotate(45 811 74)"/>
    <path d="M 797 56 L 811 47 L 825 56 V 74 L 811 83 L 797 74 Z" fill="none" stroke="#9fef00" stroke-width="2" opacity=".7"/>
  </g>
</svg>
